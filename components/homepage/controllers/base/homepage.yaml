apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: homepage
spec:
  interval: 1h
  serviceAccountName: flux
  url: oci://ghcr.io/ssouthcity/charts/homepage
  ref:
    tag: 0.2.0 # {"$imagepolicy": "updates-infra:homepage:tag"}
    digest: sha256:b5e16a8dd3357c9e387928e3ea0d2aee9e7fb63bee72c6035d353f985ad4bd7d # {"$imagepolicy": "updates-infra:homepage:digest"}
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/ssouthcity/charts/\.github/workflows/publish-chart\.yaml@refs/heads/main$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: homepage
  driftDetection:
    mode: enabled
  values:
    rootURL: "homepage.${CLUSTER_DOMAIN}"
    httpRoute:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Homepage
        gethomepage.dev/description: Dynamically Detected Homepage
        gethomepage.dev/group: Discoverability
        gethomepage.dev/icon: homepage.png
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: http
          namespace: kgateway
      hostnames:
        - "homepage.${CLUSTER_DOMAIN}"
    config:
      kubernetes.yaml: |
        mode: cluster
        ingress: false
        traefik: false
        gateway: true
      widgets.yaml: |
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: "cluster"
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - resources:
            backend: resources
            expanded: true
            cpu: true
            memory: true
            network: default
        - search:
            provider: duckduckgo
            target: _blank
      bookmarks.yaml: |
        - Developer:
            - Github:
                - abbr: GH
                  href: https://github.com/
