apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: descheduler
spec:
  interval: 1h
  serviceAccountName: flux
  url: oci://ghcr.io/ssouthcity/mirror/charts/descheduler
  ref:
    tag: 0.37.0 # {"$imagepolicy": "updates-infra:descheduler:tag"}
    digest: sha256:1289db02aa667ea2a85ec708d51f7962fcad9a832425eb29276fac14eb9cdcb4 # {"$imagepolicy": "updates-infra:descheduler:digest"}
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: descheduler
  driftDetection:
    mode: enabled
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    kind: Deployment
    service:
      enabled: true
    serviceMonitor:
      enabled: true
