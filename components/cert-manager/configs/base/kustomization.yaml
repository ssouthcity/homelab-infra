apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-issuer.yaml
configMapGenerator:
  - name: cert-manager-grafana-dashboards
    files:
      - ./dashboards/cert-manager.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: cert-manager
        app.kubernetes.io/component: monitoring
