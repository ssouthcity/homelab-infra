apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: 2

  db:
    vendor: dev-mem
    # vendor: postgres
    # host: keycloak-db-rw.keycloak.svc # CNPG rw service
    # database: keycloak
    # usernameSecret:
    #   name: keycloak-db-app # auto-generated by CNPG
    #   key: username
    # passwordSecret:
    #   name: keycloak-db-app
    #   key: password

  http:
    httpEnabled: true

  hostname:
    strict: false # no ingress, relax hostname enforcement

  proxy:
    headers: xforwarded
