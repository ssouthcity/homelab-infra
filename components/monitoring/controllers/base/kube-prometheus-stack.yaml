apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 87.12.1 # {"$imagepolicy": "updates-infra:kube-prometheus-stack:tag"}
    digest: sha256:4f160c5ea542c5978a4757d4ac554288da5dddc7203494a77dc780ca0950ba32 # {"$imagepolicy": "updates-infra:kube-prometheus-stack:digest"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  serviceAccountName: flux
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: Create
    timeout: 9m
  upgrade:
    crds: CreateReplace
    timeout: 9m
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 12h
        resources:
          requests:
            cpu: 200m
            memory: 200Mi
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        serviceMonitorSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        podMonitorSelector: {}
    grafana:
      defaultDashboardsEnabled: false
      adminPassword: flux
      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Grafana
            gethomepage.dev/description: Analytics and Visualization
            gethomepage.dev/group: Cluster
            gethomepage.dev/icon: grafana.png
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
          parentRefs:
            - name: http
              namespace: kgateway
          hostnames:
            - "grafana.${CLUSTER_DOMAIN}"
