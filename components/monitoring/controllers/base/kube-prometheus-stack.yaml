apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "85.2.0"
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakClient
metadata:
  name: grafana
spec:
  realmRef:
    name: homelab
  client:
    clientId: grafana
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    rootUrl: https://grafana.${CLUSTER_DOMAIN}
    redirectUris:
      - https://grafana.${CLUSTER_DOMAIN}/login/generic_oauth
    webOrigins:
      - https://grafana.${CLUSTER_DOMAIN}
    adminUrl: https://grafana.${CLUSTER_DOMAIN}
    baseUrl: https://grafana.${CLUSTER_DOMAIN}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  serviceAccountName: flux
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: Create
    timeout: 9m
  upgrade:
    crds: CreateReplace
    timeout: 9m
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 12h
        resources:
          requests:
            cpu: 200m
            memory: 200Mi
        serviceMonitorNamespaceSelector: {}
        serviceMonitorSelector:
          matchLabels:
            app.kubernetes.io/component: monitoring
        podMonitorNamespaceSelector: {}
        podMonitorSelector:
          matchLabels:
            app.kubernetes.io/component: monitoring
    grafana:
      defaultDashboardsEnabled: false
      adminPassword: flux
      route:
        main:
          enabled: true
          parentRefs:
            - name: http
              namespace: kgateway
          hostnames:
            - "grafana.${CLUSTER_DOMAIN}"
      auth.generic_oauth:
        enabled: true
        name: Keycloak
        allow_sign_up: true
        client_id: ${client_id}
        client_secret: ${client_secret}
        scopes: openid email profile offline_access roles
        email_attribute_path: email
        login_attribute_path: username
        name_attribute_path: full_name
        auth_url: https://keycloak.${CLUSTER_DOMAIN}/realms/homelab/protocol/openid-connect/auth
        token_url: https://keycloak.${CLUSTER_DOMAIN}/realms/homelab/protocol/openid-connect/token
        api_url: https://keycloak.${CLUSTER_DOMAIN}/realms/homelab/protocol/openid-connect/userinfo
        signout_redirect_url: https://keycloak.${CLUSTER_DOMAIN}/realms/homelab/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fhttps%3A%2F%2Fgrafana.${CLUSTER_DOMAIN}%2Flogin
        role_attribute_path: contains(roles[*], 'grafana-admin') && 'Admin' || contains(roles[*], 'grafana-editor') && 'Editor' || 'Viewer'
