apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./gateway.yaml
configMapGenerator:
  - name: kgateway-grafana-dashboards
    files:
      - ./dashboards/agentgateway.json
      - ./dashboards/envoy.json
      - ./dashboards/kgateway.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: kgateway
        app.kubernetes.io/component: monitoring
