apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: longhorn
spec:
  interval: 1h
  serviceAccountName: flux
  url: oci://ghcr.io/ssouthcity/mirror/charts/longhorn
  ref:
    semver: ~1
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: longhorn
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    defaultSettings:
      allowCollectingLonghornUsageMetrics: false
    httproute:
      enabled: true
      parentRefs:
        - name: http
          namespace: kgateway
      hostnames:
        - "longhorn.${CLUSTER_DOMAIN}"
