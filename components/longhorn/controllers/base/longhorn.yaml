apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: longhorn
spec:
  interval: 1h
  serviceAccountName: flux
  url: oci://ghcr.io/ssouthcity/mirror/charts/longhorn
  ref:
    tag: 1.13.0 # {"$imagepolicy": "updates-infra:longhorn:tag"}
    digest: sha256:269a946241564d54dbc5dfc92ed70e3ecd7753cea908ec6e887f7b6cf8c25670 # {"$imagepolicy": "updates-infra:longhorn:digest"}
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: longhorn
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    defaultSettings:
      allowCollectingLonghornUsageMetrics: false
    httproute:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Longhorn
        gethomepage.dev/description: Distributed Block Storage
        gethomepage.dev/group: Cluster
        gethomepage.dev/icon: longhorn.png
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: http
          namespace: kgateway
      hostnames:
        - "longhorn.${CLUSTER_DOMAIN}"
    metrics:
      serviceMonitor:
        enabled: true
