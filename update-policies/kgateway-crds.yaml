apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: kgateway-crds
spec:
  provider: generic
  image: cr.kgateway.dev/kgateway-dev/charts/kgateway-crds
  interval: 12h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kgateway-crds
spec:
  imageRepositoryRef:
    name: kgateway-crds
  policy:
    semver:
      range: ">=2.3.4"
  digestReflectionPolicy: IfNotPresent
