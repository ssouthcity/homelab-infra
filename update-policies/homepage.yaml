apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: homepage
spec:
  provider: generic
  serviceAccountName: flux
  image: ghcr.io/ssouthcity/charts/homepage
  interval: 12h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: homepage
spec:
  imageRepositoryRef:
    name: homepage
  policy:
    semver:
      range: ">=0.2.0"
  digestReflectionPolicy: IfNotPresent
