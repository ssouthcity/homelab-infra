apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: descheduler
spec:
  provider: generic
  serviceAccountName: flux
  image: ghcr.io/ssouthcity/mirror/charts/descheduler
  interval: 12h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: descheduler
spec:
  imageRepositoryRef:
    name: descheduler
  policy:
    semver:
      range: ">=0.35.1"
  digestReflectionPolicy: IfNotPresent
