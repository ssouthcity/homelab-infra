apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: metrics-server
spec:
  provider: generic
  image: ghcr.io/controlplaneio-fluxcd/charts/metrics-server
  interval: 12h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: metrics-server
spec:
  imageRepositoryRef:
    name: metrics-server
  policy:
    semver:
      range: ">=3.13.0"
  digestReflectionPolicy: IfNotPresent
