apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: rivers
spec:
  provider: generic
  serviceAccountName: flux
  image: ghcr.io/ion-elgreco/charts/rivers
  interval: 12h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: rivers
spec:
  imageRepositoryRef:
    name: rivers
  policy:
    semver:
      range: ">=0.2.1"
  digestReflectionPolicy: IfNotPresent
