# Default values for homepage.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas
replicaCount: 1

# -- Deployment update strategy
strategy:
  type: RollingUpdate

# -- Container image configuration
image:
  repository: ghcr.io/gethomepage/homepage
  pullPolicy: Always
  tag: ""

# -- Image pull secrets
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""

# -- Override the full app name
fullnameOverride: ""

# -- Service Account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# -- RBAC (ClusterRole + ClusterRoleBinding) configuration
# Required for Kubernetes API access (widgets, info widgets)
rbac:
  create: true
  extraRules: []

# -- Pod annotations
podAnnotations: {}

# -- Pod labels
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}

# -- Container-level security context
# Follows Homepage recommended security settings
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Service configuration
service:
  type: ClusterIP
  port: 3000
  annotations: {}

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: homepage.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Expose the service via Gateway API HTTPRoute
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - homepage.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# -- Environment variables for the homepage container
# Keys with simple values are set directly; use YAML anchors for valueFrom
env:
  HOMEPAGE_ALLOWED_HOSTS: ""
  TZ: "UTC"

# -- Env vars using valueFrom (e.g. fieldRef, secretKeyRef, configMapKeyRef)
envValueFrom:
  MY_POD_IP:
    fieldRef:
      fieldPath: status.podIP

# -- Homepage configuration files
# Each key is mounted as a file in /app/config/
# Supports tpl templating so you can reference Helm values
config:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  bookmarks.yaml: ""
  services.yaml: ""
  widgets.yaml: ""
  docker.yaml: ""
  custom.css: ""
  custom.js: ""

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /api/healthcheck
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /api/healthcheck
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

# -- Resource limits and requests
resources: {}

# -- Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# -- Additional volumes (e.g. for persistent config)
volumes: []

# -- Additional volume mounts
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
